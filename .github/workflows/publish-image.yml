# Build the server and setup images from this repository's source, publish them to GHCR
# on a release tag, and create the GitHub Release that names what was published.
#
# Only `actions/checkout` is used, plus the docker and gh CLIs already on the runner. The
# organisation restricts Actions to an allowlist (`allowed_actions: selected`), so every
# other tool runs as a CLI or a container in a `run` step — a workflow that needs an
# allowlist edit to run is a workflow that fails on its first push.
#
# Release contract, enforced below rather than by convention:
#   - A release tag is published once. If either image already carries the tag, or a
#     GitHub Release already exists for it, the run fails before anything is pushed.
#   - Only the release tag is pushed. No floating tag (`latest`) is moved: a deployment
#     names the tag, or better the digest the Release notes carry.
name: Publish image

on:
  push:
    branches:
      - scality-1.4
    tags:
      - 'v*-scality.*'
  pull_request:
    branches:
      - scality-1.4
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SETUP_IMAGE: ghcr.io/${{ github.repository }}-setup

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.push.outputs.version }}
      server_digest: ${{ steps.push.outputs.server_digest }}
      setup_digest: ${{ steps.push.outputs.setup_digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t "$IMAGE:ci-${GITHUB_SHA}" .

      # A build that produces an image which cannot start is not a passing build. This is
      # the cheapest real assertion available without S3 credentials: the launcher must be
      # executable and the server must reject a run with no config rather than, say, fail
      # on a missing exec bit — the failure mode `jar xf` introduces by dropping POSIX
      # permissions.
      - name: Smoke-test the entrypoint
        run: |
          set -o pipefail
          out="$(docker run --rm --entrypoint sh "$IMAGE:ci-${GITHUB_SHA}" \
                   -c 'test -x bin/delta-sharing-server && echo LAUNCHER_EXECUTABLE')"
          echo "$out" | grep -q LAUNCHER_EXECUTABLE
          docker run --rm "$IMAGE:ci-${GITHUB_SHA}" --help 2>&1 | head -20 || true

      # The setup image is built FROM the server image just built, by its local tag, so
      # the two images published under one version are provably the same server build.
      - name: Build the setup image
        run: |
          # The version baked in is the tag on a tag build, the short SHA otherwise.
          case "$GITHUB_REF" in
            refs/tags/*) SETUP_VERSION="${GITHUB_REF#refs/tags/}" ;;
            *)           SETUP_VERSION="ci-${GITHUB_SHA::12}" ;;
          esac
          docker build --build-arg SERVER_IMAGE="$IMAGE:ci-${GITHUB_SHA}" \
            --build-arg SETUP_VERSION="$SETUP_VERSION" \
            -f setup/Dockerfile -t "$SETUP_IMAGE:ci-${GITHUB_SHA}" .

      - name: Smoke-test the setup image
        run: |
          set -o pipefail
          docker run --rm --entrypoint python3 "$SETUP_IMAGE:ci-${GITHUB_SHA}" -c 'print("python ok")'
          docker run --rm --entrypoint keytool "$SETUP_IMAGE:ci-${GITHUB_SHA}" -help >/dev/null 2>&1 && echo "keytool ok"
          # The documented run must reach the page: the container binds every interface,
          # the published port is what restricts access.
          docker run -d --name setup-smoke -p 127.0.0.1:18088:8088 "$SETUP_IMAGE:ci-${GITHUB_SHA}"
          for i in $(seq 1 30); do
            curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/ 2>/dev/null | grep -q 200 && break
            sleep 1
          done
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18088/ | grep -q 200
          docker logs setup-smoke 2>&1 | grep -q '^Setup token: ' && echo "token printed"
          docker rm -f setup-smoke >/dev/null
          # A public image must carry nothing internal.
          docker run --rm --entrypoint sh "$SETUP_IMAGE:ci-${GITHUB_SHA}" -c \
            '! grep -rilE "covea|isv\.scality|10\.0\.50\.|\b(ISVD|ISVA|SIZR)-[0-9]+\b|chicago" /opt/setup'

      # End to end against CloudServer behind a self-signed CA, then over plain HTTP: the
      # first automated check in this repository that would notice a dropped presigner fix.
      - name: Integration test
        run: PLATFORM= bash setup/ci/integration.sh "$SETUP_IMAGE:ci-${GITHUB_SHA}"

      # Publishing is tag-driven. A push to the release branch proves the build; it does
      # not move a tag anyone deploys.
      # Context values go through env rather than being interpolated into the shell
      # command, so nothing from the event payload can be parsed as script.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # A tag that is already published is never published again: a deployment that
      # pinned it must keep getting the bytes it validated. Both checks run before the
      # first push, so a refused run leaves the registry and the Releases page as they
      # were.
      - name: Refuse a tag that is already published
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          refused=0
          for ref in "$IMAGE:${VERSION}" "$SETUP_IMAGE:${VERSION}"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists; a release tag is published once. Tag the next v<upstream>-scality.<n> instead."
              refused=1
            fi
          done
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::a GitHub Release named $VERSION already exists."
            refused=1
          fi
          exit "$refused"

      - name: Push the release tag
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          docker tag "$IMAGE:ci-${GITHUB_SHA}" "$IMAGE:${VERSION}"
          docker push "$IMAGE:${VERSION}"
          docker tag "$SETUP_IMAGE:ci-${GITHUB_SHA}" "$SETUP_IMAGE:${VERSION}"
          docker push "$SETUP_IMAGE:${VERSION}"
          # The registry digest, which only exists once the push has landed. It is what
          # the Release notes publish and what a deployment should pin.
          server_digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:${VERSION}" | grep "^$IMAGE@" | head -n1 | cut -d@ -f2)"
          setup_digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SETUP_IMAGE:${VERSION}" | grep "^$SETUP_IMAGE@" | head -n1 | cut -d@ -f2)"
          test -n "$server_digest" && test -n "$setup_digest"
          {
            echo "version=${VERSION}"
            echo "server_digest=${server_digest}"
            echo "setup_digest=${setup_digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Published $IMAGE:${VERSION} (${server_digest})"
            echo
            echo "Published $SETUP_IMAGE:${VERSION} (${setup_digest})"
          } >> "$GITHUB_STEP_SUMMARY"

  # The Release object for a published tag: notes naming both images by digest.
  # `gh release create` rather than a release action: the CLI is on the runner already,
  # and the job needs no allowlist entry.
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Write the release notes
        env:
          VERSION: ${{ needs.image.outputs.version }}
          SERVER_DIGEST: ${{ needs.image.outputs.server_digest }}
          SETUP_DIGEST: ${{ needs.image.outputs.setup_digest }}
        run: bash .github/scripts/release-notes.sh > release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file release-notes.md
