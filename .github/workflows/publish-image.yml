# Build the server image from this repository's source and publish it to GHCR.
#
# Only `actions/checkout` is used, plus the docker CLI already on the runner. The
# organisation restricts Actions to an allowlist (`allowed_actions: selected`) that does
# not include `docker/*`, so `docker/login-action` and `docker/build-push-action` are
# avoided deliberately — a workflow that needs an allowlist edit to run is a workflow that
# fails on its first push.
name: Publish image

on:
  push:
    branches:
      - scality-1.4
    tags:
      - 'v*-scality.*'
  pull_request:
    branches:
      - scality-1.4
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SETUP_IMAGE: ghcr.io/${{ github.repository }}-setup

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t "$IMAGE:ci-${GITHUB_SHA}" .

      # A build that produces an image which cannot start is not a passing build. This is
      # the cheapest real assertion available without S3 credentials: the launcher must be
      # executable and the server must reject a run with no config rather than, say, fail
      # on a missing exec bit — the failure mode `jar xf` introduces by dropping POSIX
      # permissions.
      - name: Smoke-test the entrypoint
        run: |
          set -o pipefail
          out="$(docker run --rm --entrypoint sh "$IMAGE:ci-${GITHUB_SHA}" \
                   -c 'test -x bin/delta-sharing-server && echo LAUNCHER_EXECUTABLE')"
          echo "$out" | grep -q LAUNCHER_EXECUTABLE
          docker run --rm "$IMAGE:ci-${GITHUB_SHA}" --help 2>&1 | head -20 || true

      # The setup image is built FROM the server image just built, by its local tag, so
      # the two images published under one version are provably the same server build.
      - name: Build the setup image
        run: |
          docker build --build-arg SERVER_IMAGE="$IMAGE:ci-${GITHUB_SHA}" \
            -f setup/Dockerfile -t "$SETUP_IMAGE:ci-${GITHUB_SHA}" .

      - name: Smoke-test the setup image
        run: |
          set -o pipefail
          docker run --rm --entrypoint python3 "$SETUP_IMAGE:ci-${GITHUB_SHA}" -c 'print("python ok")'
          docker run --rm --entrypoint keytool "$SETUP_IMAGE:ci-${GITHUB_SHA}" -help >/dev/null 2>&1 && echo "keytool ok"
          # The documented run must reach the page: the container binds every interface,
          # the published port is what restricts access.
          docker run -d --name setup-smoke -p 127.0.0.1:18088:8088 "$SETUP_IMAGE:ci-${GITHUB_SHA}"
          for i in $(seq 1 30); do
            curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/ 2>/dev/null | grep -q 200 && break
            sleep 1
          done
          curl -sS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18088/ | grep -q 200
          docker logs setup-smoke 2>&1 | grep -q '^Setup token: ' && echo "token printed"
          docker rm -f setup-smoke >/dev/null
          # A public image must carry nothing internal.
          docker run --rm --entrypoint sh "$SETUP_IMAGE:ci-${GITHUB_SHA}" -c \
            '! grep -rilE "covea|isv\.scality|10\.0\.50\.|\b(ISVD|ISVA|SIZR)-[0-9]+\b|chicago" /opt/setup'

      # End to end against CloudServer behind a self-signed CA, then over plain HTTP: the
      # first automated check in this repository that would notice a dropped presigner fix.
      - name: Integration test
        run: PLATFORM= bash setup/ci/integration.sh "$SETUP_IMAGE:ci-${GITHUB_SHA}"

      # Publishing is tag-driven. A push to the release branch proves the build; it does
      # not move a tag anyone deploys.
      # Context values go through env rather than being interpolated into the shell
      # command, so nothing from the event payload can be parsed as script.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Push the release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          docker tag "$IMAGE:ci-${GITHUB_SHA}" "$IMAGE:${VERSION}"
          docker tag "$IMAGE:ci-${GITHUB_SHA}" "$IMAGE:latest"
          docker push "$IMAGE:${VERSION}"
          docker push "$IMAGE:latest"
          docker tag "$SETUP_IMAGE:ci-${GITHUB_SHA}" "$SETUP_IMAGE:${VERSION}"
          docker tag "$SETUP_IMAGE:ci-${GITHUB_SHA}" "$SETUP_IMAGE:latest"
          docker push "$SETUP_IMAGE:${VERSION}"
          docker push "$SETUP_IMAGE:latest"
          echo "Published $IMAGE:${VERSION}, $IMAGE:latest, $SETUP_IMAGE:${VERSION} and $SETUP_IMAGE:latest" >> "$GITHUB_STEP_SUMMARY"
