# Reference Kubernetes deployment of the setup image (the sharing server plus its setup
# page), written for ARTESCA / MetalK8s and usable on any cluster.
#
#   kubectl create namespace opensharing
#   kubectl apply -k deploy/kubernetes/ -n opensharing
#
# Pin the image: set `images[].newTag` (and preferably `digest`) in kustomization.yaml
# to a release from https://github.com/scality/databricks-opensharing/releases.
#
# Exposure: the `opensharing` Service carries the share protocol only; put the cluster
# Ingress in front of it for recipients. The setup page is deliberately in no Service —
# reach it with `kubectl port-forward deploy/opensharing 8088:8088`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensharing-config
  labels:
    app.kubernetes.io/name: opensharing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensharing
  labels:
    app.kubernetes.io/name: opensharing
spec:
  replicas: 1
  # One process owns /config and the rendered configuration; two pods on one volume
  # would each start a server against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensharing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensharing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensharing
          image: ghcr.io/scality/databricks-opensharing-setup
          ports:
            - name: server
              containerPort: 8080
            - name: setup
              containerPort: 8088
          # /healthz: the setup process answers. /readyz: the sharing server is up and
          # answers its own /healthz — so an unconfigured pod is live but not ready,
          # and no recipient traffic is routed to it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: setup
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: setup
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # Lab values, not a measurement.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opensharing-config
---
apiVersion: v1
kind: Service
metadata:
  name: opensharing
  labels:
    app.kubernetes.io/name: opensharing
spec:
  selector:
    app.kubernetes.io/name: opensharing
  ports:
    - name: server
      port: 80
      targetPort: server
