# Reference Kubernetes deployment of the setup image (the sharing server plus its setup
# page), written for ARTESCA / MetalK8s and usable on any cluster.
#
#   kubectl create namespace opensharing
#   kubectl apply -k deploy/kubernetes/ -n opensharing
#
# Pin the image: set `images[].newTag` (and preferably `digest`) in kustomization.yaml
# to a release from https://github.com/scality/databricks-opensharing/releases.
#
# Ports (deploy/ports.yaml): 9480 share protocol, 9481 setup page, 9482 metrics and
# probes. The `opensharing` Service carries the share protocol, for the cluster Ingress
# in front of recipients; `opensharing-metrics` the metrics port. The setup page
# is deliberately in no Service — reach it with
# `kubectl port-forward deploy/opensharing 9481:9481`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensharing-config
  labels:
    app.kubernetes.io/name: opensharing
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensharing
  labels:
    app.kubernetes.io/name: opensharing
spec:
  replicas: 1
  # One process owns /config and the rendered configuration; two pods on one volume
  # would each start a server against it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensharing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensharing
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensharing
          image: ghcr.io/scality/databricks-opensharing-setup
          ports:
            - name: server
              containerPort: 9480
            - name: setup
              containerPort: 9481
            - name: metrics
              containerPort: 9482
          # /healthz: the setup process answers. /readyz: the sharing server is up and
          # answers its own /healthz — so an unconfigured pod is live but not ready,
          # and no recipient traffic is routed to it.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          # Lab values, not a measurement.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: opensharing-config
---
apiVersion: v1
kind: Service
metadata:
  name: opensharing
  labels:
    app.kubernetes.io/name: opensharing
spec:
  selector:
    app.kubernetes.io/name: opensharing
  ports:
    - name: server
      port: 80
      targetPort: server
---
# Metrics only, for servicemonitor.yaml. Its own Service because it publishes pods that
# are not ready: an unconfigured or failed deployment is exactly when the metrics must
# still be scraped, and the share Service above must not route recipients to it.
apiVersion: v1
kind: Service
metadata:
  name: opensharing-metrics
  labels:
    app.kubernetes.io/name: opensharing
    app.kubernetes.io/component: metrics
    # Becomes the Prometheus `job` label (servicemonitor.yaml `jobLabel`), the value
    # monitoring/alerts.yaml matches on.
    scality.com/job: isv-opensharing
spec:
  selector:
    app.kubernetes.io/name: opensharing
  publishNotReadyAddresses: true
  ports:
    - name: metrics
      port: 9482
      targetPort: metrics
