# TLS front for the integration test: terminates HTTPS with a self-signed CA and
# forwards to CloudServer, passing Host through unchanged — a SigV4 signature covers
# the Host header, so the storage must see the same name the client signed.
server {
    listen 443 ssl;
    server_name s3.local.test;
    ssl_certificate     /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    client_max_body_size 64m;
    location / {
        proxy_pass http://cloudserver:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
