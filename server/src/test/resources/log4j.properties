# Test runs: plain text on stderr, so suite output stays readable. The packaged server
# uses server/src/universal/conf/log4j.properties (JSON). AccessAuditSuite attaches its
# own appender to capture audit events.
log4j.rootLogger=INFO, stderr
log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%d{HH:mm:ss.SSS} %-5p %c{1} - %m%n
