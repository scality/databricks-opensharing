# Scality fork: every logger, the audit logger included, writes one JSON object per line
# to stdout (io.delta.sharing.server.scality.JsonLayout). The audit events are on the
# logger io.delta.sharing.audit.
#
# To change a level, or to go back to plain text, point the JVM at another file:
#   JAVA_TOOL_OPTIONS=-Dlog4j.configuration=file:/config/log4j.properties
log4j.rootLogger=INFO, stdout
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=io.delta.sharing.server.scality.JsonLayout

log4j.logger.io.delta.sharing.audit=INFO
